<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' https://raw.communitydragon.org; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com">
  <title>ff</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <!-- The logo is the Party button; Profile and Friends live in the account menu (top right) -->
      <button class="brand tab" data-tab="party" type="button" aria-label="Party" title="Party"><img class="brand__logo" src="assets/ff-mark.png" alt=""><span class="brand__text" id="brandText">ff</span></button>
      <!-- On hold: Explore, Shared skinlines, Collection, Stats. Their code is still in app.js / collection.js. -->
      <div class="search">
        <svg class="search__icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7.5"/><path d="m21 21-4.3-4.3"/></svg>
        <input class="input search__input" id="search" type="search" placeholder="Search Riot ID" aria-label="Search for a player by Riot ID" autocomplete="off">
        <p class="search__msg" id="searchMsg" role="status" hidden></p>
      </div>
      <div class="topbar__right">
        <!-- filled by renderHeader(): your icon + name; opens the account menu -->
        <div class="me-wrap">
          <button class="me-chip" id="me" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="meMenu"></button>
          <div class="menu" id="meMenu" role="menu" hidden>
            <div class="menu__head" id="meMenuHead"></div>
            <button class="menu__item" role="menuitem" data-menu="profiles" type="button">
              <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>Profile</button>
            <button class="menu__item" role="menuitem" data-menu="friends" type="button">
              <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7"/><path d="M18 14.2a6.5 6.5 0 0 1 3.5 5.8"/></svg>Friends</button>
            <div class="menu__sep" role="separator"></div>
            <button class="menu__item" role="menuitem" data-menu="settings" type="button">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>Settings</button>
            <button class="menu__item menu__item--update" role="menuitem" data-menu="update" type="button" hidden>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg><span id="updateLabel">Restart to update</span></button>
            <button class="menu__item" role="menuitem" data-menu="refresh" type="button">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg>Refresh</button>
          </div>
        </div>
      </div>
    </header>
    <main class="view" id="view"></main>
    <div class="toast-root" id="toastRoot" aria-live="polite"></div>
  </div>


  <script src="common.js"></script>
  <script src="collection.js"></script>
  <script src="profiles.js"></script>
  <script src="friends.js"></script>
  <script src="app.js"></script>
</body>
</html>
